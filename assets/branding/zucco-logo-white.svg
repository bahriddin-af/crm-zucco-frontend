<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Top Bar: Emerald Bright -->
    <linearGradient id="whiteTopBeam" x1="20" y1="20" x2="100" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Diagonal: Mint Bright -->
    <linearGradient id="whiteDiagBeam" x1="100" y1="26" x2="20" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Bottom Bar: Teal Vibrant -->
    <linearGradient id="whiteBottomBeam" x1="20" y1="78" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <style>
      .wordmark-white {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 68px;
        fill: #FFFFFF;
        letter-spacing: -2px;
      }
    </style>
  </defs>

  <!-- Geometric Symbol 'Z' -->
  <g>
    <path d="M 24 22 L 96 22 C 101.5 22 106 26.5 106 32 L 106 42 L 46 42 C 38 42 32 37 30 31 L 24 22 Z" fill="url(#whiteTopBeam)" />
    <path d="M 106 22 L 106 42 L 56 98 L 34 98 L 94 36 C 99 31 102.5 26 106 22 Z" fill="url(#whiteDiagBeam)" />
    <path d="M 34 98 L 102 98 C 107.5 98 112 93.5 112 88 L 112 78 L 52 78 C 44 78 39 83 37 89 L 34 98 Z" fill="url(#whiteBottomBeam)" />
  </g>

  <!-- Brand Wordmark: "zucco" in Pure White -->
  <text x="145" y="85" class="wordmark-white">zucco</text>
</svg>
