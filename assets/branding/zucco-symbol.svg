<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Top Bar: Deep Emerald -->
    <linearGradient id="topBeam" x1="18" y1="20" x2="82" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E543F" />
      <stop offset="100%" stop-color="#146B52" />
    </linearGradient>

    <!-- Right Turn / Diagonal: Emerald into Mint -->
    <linearGradient id="diagBeam" x1="82" y1="24" x2="18" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#146B52" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Bottom Bar: Vibrant Mint -->
    <linearGradient id="bottomBeam" x1="18" y1="62" x2="82" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Drop Shadow for soft dimensional separation -->
    <filter id="ribbonShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0B3728" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#ribbonShadow)">
    <!-- Top horizontal beam -->
    <path d="M 18 20 L 76 20 C 80.4 20 84 23.6 84 28 L 84 38 L 36 38 C 30 38 25 34 23 29 L 18 20 Z" fill="url(#topBeam)" />

    <!-- Isometric Fold Top-Right to Diagonal -->
    <path d="M 84 20 L 84 38 L 44 80 L 26 80 L 74 32 C 78 28 80.8 24 84 20 Z" fill="url(#diagBeam)" />

    <!-- Bottom horizontal beam -->
    <path d="M 26 80 L 82 80 C 86.4 80 90 76.4 90 72 L 90 62 L 42 62 C 36 62 31 66 29 71 L 26 80 Z" fill="url(#bottomBeam)" />
  </g>
</svg>
