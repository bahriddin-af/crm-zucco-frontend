<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="appBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2B24" />
      <stop offset="100%" stop-color="#0E1713" />
    </linearGradient>

    <!-- Squircle Shadow -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#10B981" flood-opacity="0.25" />
    </filter>

    <!-- Emblem Gradients -->
    <linearGradient id="appTopBeam" x1="120" y1="120" x2="380" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="appDiagBeam" x1="380" y1="140" x2="130" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="appBottomBeam" x1="130" y1="340" x2="390" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded App Icon Base -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#appBg)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="113.5" fill="none" stroke="#2D3F35" stroke-width="3" />

  <!-- Geometric Symbol 'Z' Centered (scaled by 3.4x from 100x100) -->
  <g transform="translate(86, 86) scale(3.4)" filter="url(#iconGlow)">
    <!-- Top Beam -->
    <path d="M 18 18 L 74 18 C 79 18 83 22 83 27 L 83 36 L 36 36 C 29 36 24 32 22 26 L 18 18 Z" fill="url(#appTopBeam)" />
    <!-- Diagonal Ribbon -->
    <path d="M 83 18 L 83 36 L 43 82 L 25 82 L 73 29 C 77 25 80 21 83 18 Z" fill="url(#appDiagBeam)" />
    <!-- Bottom Beam -->
    <path d="M 25 82 L 80 82 C 85 82 89 78 89 73 L 89 64 L 41 64 C 34 64 30 68 28 74 L 25 82 Z" fill="url(#appBottomBeam)" />
  </g>
</svg>
